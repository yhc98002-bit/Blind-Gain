# ST3-7B arm 1 (st3_std) — standard GRPO answer reward on the HB coordinate
# training split. Registered: docs/registered_stage3_7b_v1.md §2 arm `st3_std`
# + Launch amendment 1 (coord-only split, cells n8/n12).
#
# Deltas vs the c5 7B precedent, each deliberate:
#   train_files      -> the ST3 corpus (720 groups x 4 members = 2,880 rows)
#   val_files/val_*  -> disabled; ST3's endpoints are checkpoint evals (Mini-A5 precedent)
#   shuffle          -> false; the corpus is pre-shuffled at group granularity and
#                       must stay group-adjacent for the arm-2 grouping mode
#   rollout_batch_size 240 (divisible by the group size 4; 12 steps/epoch over
#                       2,880 rows, ~8 epochs at 100 steps — the Mini-A5 ratio)
#   global_batch_size 48 (rollout/global = 5, Mini-A5 ratio; divisible by 8 GPUs)
#   n_gpus_per_node  8  (one trainer per node: an12 is running LH2, so the arms
#                       run sequentially on an29 at 8 GPUs rather than 4+4)
#   save_model_only  false + save_limit 3 -> resumable; a 7B run is ~1.5-3 days
#                       and save_model_only checkpoints cannot resume
data:
  train_files: data/st3_train_v1/train.parquet
  val_files: null
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 2048
  max_response_length: 2048
  rollout_batch_size: 240
  mini_rollout_batch_size: null
  val_batch_size: 32
  format_prompt: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/artifacts/repos/EasyR1/examples/format_prompt/r1v.jinja
  override_chat_template: null
  shuffle: false
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true
  image_condition: real          # both ST3 arms are sighted; arms differ by reward only
  image_condition_seed: 20260710
  caption_store_paths:
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_0.jsonl
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_1.jsonl
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_2.jsonl
algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
worker:
  actor:
    global_batch_size: 48
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    padding_free: false
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/artifacts/models/Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 5
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.45
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.0
      top_p: 1.0
      n: 1
  ref:
    padding_free: false
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false
  reward:
    reward_function: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/src/rewards/pilot_reward.py:compute_score
    reward_function_kwargs:
      format_weight: 0.5
      require_shadow_log: true
      symbolic_grader_timeout_seconds: 5.0
trainer:
  total_epochs: 1
  max_steps: 100
  project_name: blind_gains_c5_7b
  experiment_name: st3_std_seed1_7b
  logger:
  - file
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 0
  val_before_train: false
  val_only: false
  val_generations_to_log: 8
  save_freq: 20
  save_limit: 3
  save_model_only: false
  save_checkpoint_path: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/checkpoints/st3/st3_std_seed1_7b
  load_checkpoint_path: null
  find_last_checkpoint: false
