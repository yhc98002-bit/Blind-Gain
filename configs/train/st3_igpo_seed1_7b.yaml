# ST3-7B arm 2 (st3_igpo) — necessity-sampled intervention-group reward on the
# HB coordinate training split. Registered: docs/registered_stage3_7b_v1.md §2
# arm `st3_igpo` + Launch amendment 1 (coord-only split, cells n8/n12) +
# Launch amendment 2 (group = one SIDE of a mother-item, k=2).
#
# This file is arm 1's config with FOUR deltas and nothing else, because §4
# requires the arms to differ in the reward and C1's sampling distribution only:
#
#   1. train_files      -> the C1 necessity-sampled side2 corpus. Necessity is a
#                          SAMPLING PROBABILITY only (I1): no reward term, no
#                          loss weight, no advantage transform. Same 720 mother
#                          items, same row count, same rollout budget as arm 1;
#                          only the visit frequencies differ.
#   2. pair_group_mode  -> joint. Rows sharing a pair_group_uid form ONE GRPO
#                          normalisation group and receive the group's joint
#                          reward, instead of each prompt normalising alone.
#                          Requires the hier grouping patch in the EasyR1 tree.
#   3. reward_function  -> igpo_reward.compute_score. Same shape as arm 1's
#                          pilot reward, (1-fw)*accuracy + fw*format, with the
#                          member accuracy replaced by the premise-gated joint
#                          accuracy and the format term averaged over the group
#                          (a per-member format term is not broadcast-identical
#                          and the group advantage step refuses it).
#   4. experiment_name / save_checkpoint_path -> arm 2's own run directory.
#
# Identical to arm 1: base checkpoint, optimizer, KL, batch and rollout budget
# (rollout_batch_size 240 is divisible by the group size 2 -> 120 groups/step),
# max_steps, save cadence, eval schedule, decoding lock, seed, image condition.
#
# Group size 2 rather than 4: the registered both-sides product leaves only
# 2.41% of groups able to produce a GRPO gradient at base competence, against
# 42.2% for the Mini-A5 k=2 arm the registration names as C2's reference
# implementation. reports/st3_joint_feasibility_v1.md carries the measurement;
# the deviation and its cost are recorded in Launch amendment 2.
data:
  train_files: data/st3_necessity_train_side2_v1/train.parquet
  val_files: data/st3_train_side2_v1/plumbing_val.jsonl
  prompt_key: problem
  answer_key: answer
  image_key: images
  video_key: videos
  image_dir: null
  video_fps: 2.0
  max_prompt_length: 4096
  max_response_length: 2048
  rollout_batch_size: 240
  mini_rollout_batch_size: null
  val_batch_size: 32
  format_prompt: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/artifacts/repos/EasyR1/examples/format_prompt/r1v.jinja
  override_chat_template: null
  shuffle: false
  seed: 1
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: true
  image_condition: real          # both ST3 arms are sighted; arms differ by reward only
  image_condition_seed: 20260710
  caption_store_paths:
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_0.jsonl
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_1.jsonl
  - experiments/runs/geometry3k_qwen25vl3b_captionstore384_20260710T005300Z/shards/store_shard_2.jsonl
algorithm:
  adv_estimator: grpo
  pair_group_mode: joint         # the intervention: group-level reward + advantage
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 0.01
  online_filtering: false
  filter_key: overall
  filter_low: 0.01
  filter_high: 0.99
worker:
  actor:
    global_batch_size: 48
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 2
    max_grad_norm: 1.0
    padding_free: false
    dynamic_batching: true
    ulysses_size: 1
    model:
      model_path: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/artifacts/models/Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: true
      lora:
        rank: 0
        alpha: 64
        target_modules: all-linear
        exclude_modules: .*visual.*
    optim:
      lr: 1.0e-06
      weight_decay: 0.01
      strategy: adamw
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 5
    temperature: 1.0
    top_p: 1.0
    limit_images: 0
    gpu_memory_utilization: 0.45
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 1
    disable_tqdm: false
    val_override_config:
      temperature: 0.0
      top_p: 1.0
      n: 1
  ref:
    padding_free: false
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
    offload:
      offload_params: false
  reward:
    reward_function: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/src/rewards/igpo_reward.py:compute_score
    reward_function_kwargs:
      format_weight: 0.5
      require_shadow_log: true
      symbolic_grader_timeout_seconds: 5.0
trainer:
  total_epochs: 1
  max_steps: 30
  project_name: blind_gains_c5_7b
  experiment_name: st3_igpo_seed1_7b
  logger:
  - file
  nnodes: 1
  n_gpus_per_node: 8
  max_try_make_batch: 20
  val_freq: 0
  val_before_train: false
  val_only: false
  val_generations_to_log: 8
  save_freq: 10
  save_limit: -1
  save_model_only: true
  save_checkpoint_path: /XYFS02/HDD_POOL/paratera_xy/pxy1289/HaocunYe/Research/BlindGain/checkpoints/st3/st3_igpo_seed1_7b
  load_checkpoint_path: null
  find_last_checkpoint: false
